[package]
name = "world-review-assistant"
version = "0.3.3"
edition = "2021"
description = "A local world report notebook and Hatena publishing assistant"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-single-instance = "=2.4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
reqwest = { version = "=0.13.4", features = ["blocking", "json", "rustls"], default-features = false }
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
quick-xml = "0.42"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"
